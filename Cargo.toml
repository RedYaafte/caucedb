[package]
name = "caucedb"
version = "0.1.0-alpha.2"
edition = "2021"
description = "A keyboard-first database workbench; Oracle supported in this preview"
license = "MIT"
repository = "https://github.com/RedYaafte/caucedb"

[dependencies]
ratatui = "0.29"
crossterm = "0.28"
tui-textarea = { version = "0.7", features = ["search"] }
oracle = "0.6.3"
serde = { version = "1", features = ["derive"] }
toml = "0.8"
directories = "6"
uuid = { version = "1", features = ["v4", "serde"] }
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
unicode-width = "0.2"

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3", features = ["sync-secret-service", "crypto-rust", "vendored"] }
[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3", features = ["apple-native"] }
[target.'cfg(target_os = "windows")'.dependencies]
keyring = { version = "3", features = ["windows-native"] }

[dev-dependencies]
tempfile = "3"
