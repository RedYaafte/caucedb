name: Linux release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  linux-x86_64:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Verify and build
        run: |
          cargo test --locked
          cargo build --release --locked
      - name: Package binary and checksum
        run: |
          mkdir -p dist
          cp target/release/caucedb LICENSE README.md dist/
          tar -C dist -czf dist/caucedb-${{ github.ref_name }}-x86_64-unknown-linux-gnu.tar.gz caucedb LICENSE README.md
          cd dist
          sha256sum caucedb-${{ github.ref_name }}-x86_64-unknown-linux-gnu.tar.gz > caucedb-${{ github.ref_name }}-x86_64-unknown-linux-gnu.tar.gz.sha256
      - name: Create GitHub prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" \
            dist/*.tar.gz dist/*.sha256 \
            --verify-tag --prerelease --generate-notes \
            --title "${{ github.ref_name }} (Linux preview)"
